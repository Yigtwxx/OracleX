name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Five jobs fire on every push, and a branch usually gets several pushes before
# it is ready. Without this the runners spend most of their time finishing runs
# whose result nobody will ever read.
#
# Only pull requests cancel. A push to main is the run that says whether main is
# green, so two landing close together have to queue rather than have the second
# discard the first's answer — and the tag that publishes an image reads that
# answer.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend (lint + syntax + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      # `ruff check` and `ruff format` disagree about different things: the
      # first about what the code does, the second about how it reads. Only the
      # first was gated here, so formatting drifted in whichever direction the
      # last editor's tooling happened to point.
      - name: Ruff format
        run: ruff format --check .

      - name: Syntax check (compileall)
        run: python -m compileall -q -x "venv|data" .

      - name: Tests
        run: pytest

  frontend:
    name: Frontend (lint + typecheck + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # Placeholder values so the production build never depends on real secrets.
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws/prices
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # `next lint` is eslint, which says nothing about formatting. Without
      # this the repository has a prettier config and a `format:check` script
      # that nothing ever ran.
      - name: Format check
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: Frontend (browser tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # The suite answers every upstream from route stubs inside the browser
      # (frontend/e2e/stubs.ts), so these only need to be well-formed: the
      # Supabase host is intercepted before DNS and the API host never binds.
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws/prices
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # `playwright.config.ts` serves the production build under CI rather than
      # `next dev`: faster to boot, and the bundle that actually ships.
      - name: Build
        run: npm run build

      - name: Browser tests
        run: npm run e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  generated:
    name: Generated files (endpoint reference + repository facts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: pip install -r backend/requirements-dev.txt

      # Only for the test count. The MCP tool list itself is read out of the
      # source with `ast`, precisely so this job does not depend on the SDK —
      # but collecting mcp-server's own tests does import it.
      - name: Install MCP server
        run: pip install -e mcp-server

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # The skill's endpoint reference is generated from the app's own OpenAPI
      # schema. Without this gate a route rename ships a skill that documents a
      # path the API no longer serves — and the agent reading it has no way to
      # tell the difference between a stale document and missing data.
      - name: Check generated reference
        run: python scripts/build_agent_skill.py --check

      # `/developers` states this repository's own numbers. Hand-maintained they
      # were wrong within a release and stayed wrong: three documents claimed 26
      # MCP tools long after there were 30, and the frontend suite was reported
      # 70 tests short because someone had counted `it(` and never saw the
      # parametrised tables. These now come from the collectors.
      #
      # This job runs in parallel with the others and is not on the critical
      # path — that belongs to the frontend build — so the extra installs cost
      # no wall-clock time.
      - name: Check generated repository facts
        run: python scripts/build_repo_facts.py --check

  mcp-server:
    name: MCP server (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e . ruff pytest pytest-asyncio

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      # These tests never reach the network. They assert that a declined
      # request, an unreachable instance and a missing token stay
      # distinguishable in the tool result, which is the property that keeps a
      # model from reporting an outage as an answer.
      - name: Tests
        run: pytest

  pr-title:
    name: PR title (Conventional Commits)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      # The title is what lands in history when a PR is squash-merged, so it is
      # the subject line the repository's own convention applies to — checking
      # only the branch commits would gate the text that gets thrown away.
      #
      # Read through an environment variable rather than `${{ }}` inside the
      # script: a title is attacker-controlled on a public repository, and
      # interpolating it into the shell would let a PR author run commands here.
      - name: Check title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          fail() { echo "::error::$1"; echo "  title: $PR_TITLE"; exit 1; }

          # The set is deliberately the six in the contributing convention, not
          # the wider Conventional Commits vocabulary. Adding one is a change to
          # the convention, which should be a visible edit rather than a silent
          # widening here.
          types='feat|fix|refactor|test|docs|chore'

          printf '%s' "$PR_TITLE" | grep -qE "^($types)(\([a-z0-9._/-]+\))?!?: .+$" \
            || fail "Expected '<type>(<scope>): <description>' with type one of: $types"

          # Dependabot composes its own titles and cannot shorten them: the
          # package name and both versions are the whole point of the subject,
          # and "bump postcss-selector-parser from 6.1.2 to 6.1.4 in /frontend"
          # is already 78 characters before anything is added. Holding a
          # security update behind a rule the author cannot satisfy leaves two
          # options, merging past a red gate or hand-editing every title, and
          # both teach people that a red gate here is normal. The format rules
          # still apply — the bot writes Conventional Commits already — so only
          # the cap comes off.
          if [ "$PR_AUTHOR" = "dependabot[bot]" ]; then
            echo "Length not checked: $PR_AUTHOR does not choose its own subject"
          elif [ "${#PR_TITLE}" -gt 72 ]; then
            fail "Subject is ${#PR_TITLE} characters; the limit is 72"
          fi

          description=${PR_TITLE#*: }
          printf '%s' "$description" | grep -qE '^[a-z0-9]' \
            || fail "Description should start lowercase"
          printf '%s' "$description" | grep -qvE '\.$' \
            || fail "Description should not end with a period"
