name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (lint + syntax + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Syntax check (compileall)
        run: python -m compileall -q -x "venv|data" .

      - name: Tests
        run: pytest

  frontend:
    name: Frontend (lint + typecheck + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # Placeholder values so the production build never depends on real secrets.
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws/prices
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  agent-skill:
    name: Agent skill (endpoint reference is current)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: pip install -r backend/requirements-dev.txt

      # The skill's endpoint reference is generated from the app's own OpenAPI
      # schema. Without this gate a route rename ships a skill that documents a
      # path the API no longer serves — and the agent reading it has no way to
      # tell the difference between a stale document and missing data.
      - name: Check generated reference
        run: python scripts/build_agent_skill.py --check

  mcp-server:
    name: MCP server (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e . ruff pytest pytest-asyncio

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      # These tests never reach the network. They assert that a declined
      # request, an unreachable instance and a missing token stay
      # distinguishable in the tool result, which is the property that keeps a
      # model from reporting an outage as an answer.
      - name: Tests
        run: pytest
