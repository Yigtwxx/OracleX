name: Publish packages

# Builds the backend and frontend images and pushes them to the GitHub
# Container Registry, which is what populates the repository's "Packages"
# section. Images land at:
#   ghcr.io/<owner>/oraclex-backend
#   ghcr.io/<owner>/oraclex-frontend
#
# Nothing here needs a secret: GITHUB_TOKEN is enough to push to GHCR for the
# repository that owns the workflow.

# A tag is what carries the version, so the tag push is what builds the
# versioned image. `release: [published]` used to be here as well and produced
# nothing a tag push had not already produced: both runs resolve the same ref,
# so the concurrency group below cancelled the tag build partway through as soon
# as the release was created, throwing away work to arrive at the same digest.
# Publishing a release now rebuilds nothing, and a tag pushed without a release
# still gets its image.
#
# `main` publishes through `workflow_run` rather than on the push itself.
# Actions has no cross-workflow `needs:`, so the two used to start together on
# the same event and race: a run whose tests were still failing had already
# moved `:latest`, and the only signal that the image was bad arrived minutes
# later on a different check. Waiting for CI to *conclude* and reading its
# verdict is the only way one workflow can gate on another.
#
# Tags stay on the plain push trigger because CI does not run on them at all
# (see `ci.yml`'s `on:`), so there would be no run to wait for. That is the
# arrangement the CI concurrency comment already assumes: a tag publishes a
# commit that went green on main first.
on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: publish-packages-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: ${{ matrix.name }} image
    runs-on: ubuntu-latest
    # A concluded CI run is not a passing one — `workflow_run` fires on failure
    # and cancellation just the same, so the conclusion has to be read. The
    # other two triggers have no run to read and are unaffected.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # The backend Dockerfile resolves `backend/...` paths, so its build
          # context is the repository root (same as docker-compose.yml).
          - name: backend
            image: oraclex-backend
            context: .
            dockerfile: backend/Dockerfile
          - name: frontend
            image: oraclex-frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
    steps:
      # `workflow_run` reports the default branch in `github.ref` and `github.sha`
      # rather than the commit whose run just passed, so both the checkout and
      # the sha tag have to be told which commit CI actually validated.
      # Defaulting to `github.sha` would publish whatever main happens to be if
      # another push landed while this one was queued — the same image under a
      # digest nothing tested.
      - name: Resolve the commit CI passed on
        id: target
        run: echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.sha }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Package names must be lowercase; the owner login may not be.
      - name: Resolve image name
        id: image
        run: echo "name=${REGISTRY}/${OWNER,,}/${IMAGE}" >> "$GITHUB_OUTPUT"
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ matrix.image }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=sha-${{ steps.target.outputs.sha }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=Oracle-X ${{ matrix.name }}
            org.opencontainers.image.description=Oracle-X ${{ matrix.name }} service image
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          # amd64 only: the backend pulls the CPU torch wheel, and building it
          # under arm64 emulation takes tens of minutes for no current consumer.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          # NEXT_PUBLIC_* values are inlined into the client bundle at build
          # time, so the published frontend image is pinned to whatever these
          # resolve to. Set them as repository variables to point the image at a
          # real deployment; otherwise it falls back to the localhost defaults
          # baked into the Dockerfile, which suit `docker compose up` only.
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:8000' }}
            NEXT_PUBLIC_WS_URL=${{ vars.NEXT_PUBLIC_WS_URL || 'ws://localhost:8000/ws/prices' }}
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'http://localhost:3100' }}
