[project]
name = "oracle-x-mcp"
version = "1.2.1"
description = "MCP server exposing a running Oracle-X instance as tools"
requires-python = ">=3.10"
dependencies = ["mcp>=2.0.0", "httpx>=0.27"]

[project.scripts]
oracle-x-mcp = "oracle_x_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["oracle_x_mcp*"]

# Mirrors backend/pyproject.toml so one repo does not have two Python styles.
[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "B", "UP", "C4"]
ignore = ["E501", "B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
